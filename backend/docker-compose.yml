services:
  redis:
    image: redis:7-alpine
    container_name: ai-clipping-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: ai-clipping-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Redis diarahkan ke service "redis" (bukan localhost) karena beda container
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      WORKER_COUNT: "3"
      PORT: ":8080"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      # Simpan hasil (video, audio, clips, dll) di host biar nggak hilang saat container di-restart
      - ./storage:/app/storage

volumes:
  redis-data:
